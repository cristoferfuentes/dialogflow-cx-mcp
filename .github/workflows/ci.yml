name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests (no network)
        run: pytest

      - name: Check that the server starts
        env:
          CXP_COOKIE: "SAPISID=dummy; SID=dummy; HSID=dummy; SSID=dummy; APISID=dummy"
          CXP_API_KEY: "dummy"
          CXP_PROJECT: "dummy-project"
        run: |
          python -c "
          import server
          print('tools:', len([t for t in dir(server) if t.startswith('cx_')]))
          "

      - name: Lint
        run: ruff check cxp server.py tests probes

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No credentials, real project ids or real agent ids in the tree
        run: |
          set -euo pipefail
          fail=0

          # 1) Real Google session cookies (long base64-ish values).
          if git grep -nIE '(SAPISID|SSID|HSID|APISID|SIDCC)=[A-Za-z0-9_-]{16,}' -- \
               ':!.env.example' ':!docs' ':!README.md'; then
            echo "::error::a real-looking session cookie is committed"
            fail=1
          fi

          # 2) A Google API key that is not the documented placeholder.
          if git grep -nIE 'AIza[0-9A-Za-z_-]{30,}' -- ':!.env.example'; then
            echo "::error::a real Google API key is committed"
            fail=1
          fi

          # 3) A storage_state / browser profile / session state committed by mistake.
          if git ls-files | grep -nE 'storage_state\.json|\.browser-profile|session-state\.json$'; then
            echo "::error::a session state file is committed"
            fail=1
          fi

          exit $fail

      - name: No credentials in the HISTORY either
        run: |
          set -euo pipefail
          fail=0

          # The whole history is scanned, not only the current tree: a secret
          # that was committed and removed later is still published.
          if git log --all -p --no-color | \
               grep -nIE '(SAPISID|SSID|HSID|APISID|SIDCC)=[A-Za-z0-9_-]{16,}' | \
               grep -vE '=\.\.\.|=XXXX|=YYYY|=ZZZZ|=WWWW|=VVVV|dummy' | head -20; then
            echo "::error::a real-looking session cookie is in the git history"
            fail=1
          fi

          if git log --all -p --no-color | \
               grep -oE 'AIza[0-9A-Za-z_-]{30,}' | sort -u | head -20; then
            echo "::error::a real Google API key is in the git history"
            fail=1
          fi

          exit $fail

      - name: The .env is never tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked"
            exit 1
          fi
