name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests unitarios (sin red)
        run: pytest

      - name: Comprobar que el servidor arranca
        env:
          CXP_COOKIE: "SAPISID=dummy; SID=dummy; HSID=dummy; SSID=dummy; APISID=dummy"
          CXP_API_KEY: "dummy"
          CXP_PROJECT: "dummy-project"
        run: |
          python -c "
          import server
          print('herramientas:', len([t for t in dir(server) if t.startswith('cx_')]))
          "

      - name: Lint
        run: |
          pip install ruff
          ruff check cxp server.py tests
