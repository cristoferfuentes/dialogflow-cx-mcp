name: Question / discussion
description: Ask about how to use the MCP, or about the measurements
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: |
        The tool you are calling, the arguments, and what you got back. Redact
        credentials, project ids and agent ids.
